name = "meatup-club"
main = "./workers/app.ts"
compatibility_date = "2025-12-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./build/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "meatup-club-db"
database_id = "3a6fb3b4-0322-4ab0-b8df-09b5d19af1c1"

[[queues.producers]]
binding = "EMAIL_DELIVERY_QUEUE"
queue = "meatup-club-email-delivery"

[[queues.consumers]]
queue = "meatup-club-email-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 5
dead_letter_queue = "meatup-club-email-delivery-dlq"

[vars]
APP_TIMEZONE = "America/New_York"
APP_BASE_URL = "https://meatup.club"

[triggers]
crons = ["*/15 * * * *"]

# Persist structured application errors for this low-volume private Worker.
# Invocation logs are disabled so request URLs and their query parameters are
# not retained by Workers Logs.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
