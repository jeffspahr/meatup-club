name: Test stability

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-stability
  cancel-in-progress: false

jobs:
  shuffled-tests:
    name: Repeat shuffled tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'app/.node-version'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run three shuffled passes
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            seed=$(( (GITHUB_RUN_ID + pass) % 2147483647 ))
            echo "Pass ${pass}/3 (seed: ${seed})"
            npm run test:run -- --sequence.shuffle --sequence.seed="${seed}"
          done
